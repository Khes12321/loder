name: Build Loader APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install NDK 25.1.8937393
        shell: pwsh
        run: |
          1..20 | ForEach-Object { "y" } | & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" "ndk;25.1.8937393"

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build Debug APK
        run: .\gradlew.bat clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Loader-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
